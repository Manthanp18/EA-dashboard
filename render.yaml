services:
  - type: web
    name: mt5-dashboard
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    env: node
    nodeVersion: 18
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: mt5-postgres
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: DASHBOARD_PASSWORD
        generateValue: true
      - key: RATE_LIMIT_PUSH
        value: 300
      - key: RATE_LIMIT_STATE
        value: 120

databases:
  - name: mt5-postgres
    databaseName: mt5_dashboard
    user: mt5_user
